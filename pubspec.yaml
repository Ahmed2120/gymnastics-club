name: gymnastics_club
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  google_fonts: ^6.3.2
  go_router: ^16.2.4
  easy_localization: ^3.0.8
  animate_do: ^4.2.0
  flutter_svg: ^2.2.2
  image_picker: ^1.2.1
  get_it: ^9.1.1
  flutter_debouncer: ^2.1.1
  shimmer: ^3.0.0
  supabase_flutter: ^2.8.1
  cached_network_image: ^3.4.1
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^21.0.0
  pinput: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#27A6FF"  # same as your app's main color
  adaptive_icon_foreground: "assets/images/app-icon.jpg"
  image_path: "assets/images/app-icon.jpg"

flutter:

  uses-material-design: true


  assets:
    - assets/images/
    - assets/languages/
    - shorebird.yaml

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
